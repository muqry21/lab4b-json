<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4b - Q2: Retrieve JSON Data</title>
</head>
<body>
  <h1>Book Collection Details</h1>
  <div id="output" role="status" aria-live="polite">Loading book data...</div>

  <script>
    async function loadBooks() {
      const outputContainer = document.getElementById("output");

      try {
        const response = await fetch("books.json");
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();
        const books = data.books;

        // Clear loading text
        outputContainer.textContent = "";

        // (a) Title of the first book
        const firstTitle = document.createElement("p");
        firstTitle.textContent = `First Book Title: ${books[0].title}`;
        outputContainer.appendChild(firstTitle);

        // (b) Author of the second book
        const secondAuthor = document.createElement("p");
        secondAuthor.textContent = `Second Book Author: ${books[1].author}`;
        outputContainer.appendChild(secondAuthor);

        // (c) Genres of both books, clearly grouped by book title
        const genresHeading = document.createElement("h2");
        genresHeading.textContent = "Genres by Book";
        outputContainer.appendChild(genresHeading);

        const genreList = document.createElement("ul");
        books.forEach((book) => {
          const li = document.createElement("li");
          li.textContent = `${book.title} — ${book.genres.join(", ")}`;
          genreList.appendChild(li);
        });
        outputContainer.appendChild(genreList);

      } catch (error) {
        outputContainer.textContent = "Failed to load book data. Please ensure you are running via a local server and books.json is valid.";
        console.error("Error fetching JSON:", error);
      }
    }

    loadBooks();
  </script>
</body>
</html>
